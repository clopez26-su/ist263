<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First JavaScript Program</title>
    <script>
        function rollover() {
            alert("My first JavaScript Program!");
        }
    </script>
</head>
<body>
    <h1>Classic First JavaScript Program</h1>
    <p>This is the content of the page.</p>
    <a onmouseover="rollover()">Roll over for a message</a>
</body>
</html>
